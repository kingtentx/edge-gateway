name: Windows build and verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify all upstream drivers were migrated
        run: python scripts/verify-driver-migration.py
      - name: Restore
        run: dotnet restore EdgeGateway.sln
      - name: Build
        run: dotnet build EdgeGateway.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/EdgeGateway.Tests/EdgeGateway.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - name: Render WinForms and verify 20 equivalent work areas
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts -Force | Out-Null
          $screenshot = Join-Path $pwd 'artifacts/ui-smoke.png'
          $process = Start-Process -FilePath './src/EdgeGateway.WinForms/bin/Release/net8.0-windows/EdgeGateway.WinForms.exe' -ArgumentList @('--smoke-test', '--layout-matrix', '--screenshot', $screenshot) -PassThru -RedirectStandardOutput 'artifacts/ui-smoke.stdout.log' -RedirectStandardError 'artifacts/ui-smoke.stderr.log'
          if (-not $process.WaitForExit(600000)) { $process.Kill(); throw 'WinForms smoke test timed out.' }
          if ($process.ExitCode -ne 0) { Get-Content 'artifacts/ui-smoke.stderr.log'; throw "WinForms smoke test failed: $($process.ExitCode)" }
          if (-not (Test-Path $screenshot)) { throw 'UI screenshot was not produced.' }
      - name: Publish Windows x64 package
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: ./scripts/publish-win-x64.ps1
      - name: Upload Windows package
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: EdgeGateway-win-x64
          path: artifacts/EdgeGateway-win-x64.zip
          if-no-files-found: error
      - name: Upload test and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            artifacts/test-results/
            artifacts/ui-smoke*
            artifacts/ui-smoke-layout-matrix/**
          if-no-files-found: warn
